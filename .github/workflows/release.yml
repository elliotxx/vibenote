name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-latest
    env:
      VIBENOTE_RELEASE_ARCH: arm64
      VIBENOTE_MAC_RELEASE_FEED_DEFAULT: github
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.CSC_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
      VIBENOTE_UPDATE_FEED_URL: ${{ secrets.VIBENOTE_UPDATE_FEED_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check public repository safety
        run: node scripts/public-safety-check.mjs --tracked

      - name: Validate release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: python3 scripts/materialize-apple-api-key.py

      - name: Build release artifacts
        run: npm run release:mac

      - name: Verify checksums
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Write release notes
        run: node scripts/release-notes.mjs --out dist/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets_file="$(mktemp)"
          node scripts/print-release-assets.mjs > "$assets_file"
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < "$assets_file"
          test "${#assets[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" \
            "${assets[@]}" \
            --verify-tag \
            --title "Vibenote ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md
